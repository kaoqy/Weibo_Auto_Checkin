<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>初始化 · 微博签到管理面板</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
    .login-card{width:380px;max-width:92vw;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow)}
    .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .login-brand .logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:19px;box-shadow:0 4px 12px rgba(224,36,94,.35)}
    .login-brand h1{margin:0;font-size:18px}
    .login-brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .login-card label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
    .login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font:inherit;outline:none}
    .login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,36,94,.15)}
    .login-card .btn{width:100%;margin-top:22px;padding:11px}
    .login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
    .init-hero{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 6px}
  </style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="initForm">
    <div class="login-brand">
      <div class="logo">签</div>
      <div>
        <h1>初始化管理员</h1>
        <p>首次部署，请设置登录账号</p>
      </div>
    </div>
    <p class="init-hero">这是首次部署（系统尚无用户）。设置管理者账号密码后即可登录使用。</p>
    <label>用户名</label>
    <input type="text" id="username" autocomplete="off" required autofocus placeholder="例如 admin" />
    <label>密码（至少 6 位）</label>
    <input type="password" id="password" autocomplete="new-password" required />
    <label>确认密码</label>
    <input type="password" id="password2" autocomplete="new-password" required />
    <button class="btn btn-primary" type="submit" id="initBtn">创建并登录</button>
    <div class="login-err" id="err"></div>
  </form>
</div>
<script>
const form = document.getElementById('initForm'), err = document.getElementById('err'), btn = document.getElementById('initBtn');
form.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = '';
  const u = username.value.trim(), p1 = password.value, p2 = password2.value;
  if (u.length < 2) { err.textContent='用户名至少 2 个字符'; return; }
  if (p1.length < 6) { err.textContent='密码至少 6 位'; return; }
  if (p1 !== p2) { err.textContent='两次密码不一致'; return; }
  btn.disabled = true; btn.textContent = '创建中…';
  try {
    const r = await fetch('/api/auth/init', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p1})});
    if (r.redirected) { location.href = r.url; return; }
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || '初始化失败'; btn.disabled=false; btn.textContent='创建并登录'; return; }
    location.href = '/';
  } catch(ex) { err.textContent='网络错误：'+ex; btn.disabled=false; btn.textContent='创建并登录'; }
});
</script>
</body>
</html>
